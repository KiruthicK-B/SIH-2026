version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: agriva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agriva_db
      POSTGRES_USER: agriva_user
      POSTGRES_PASSWORD: agriva_password_2026
    ports:
      # Host 5433 -> container 5432: this machine already has a native
      # Postgres bound to 127.0.0.1:5432, which would silently swallow
      # connections meant for this container if we reused 5432 on the host.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema.sql/seed.sql are reference docs for the relational design in the
      # README — the actual backend (backend/src/db.js) creates its own
      # generic id+JSONB tables at boot to mirror the Flutter Repository<T>
      # contract, so they're intentionally not mounted as init scripts here.

  redis:
    image: redis:7-alpine
    container_name: agriva-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  pgdata:
