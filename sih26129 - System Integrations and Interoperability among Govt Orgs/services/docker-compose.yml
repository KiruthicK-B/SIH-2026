name: onedesk

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onedesk
      POSTGRES_PASSWORD: onedesk
      POSTGRES_MULTIPLE_DATABASES: core_api,keycloak,municipal_adapter,digilocker_adapter
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    # Deliberately no host port mapping — every DB access in this project goes
    # through `docker exec`/internal Docker DNS, never host psql. A host-reachable
    # Postgres with default onedesk/onedesk credentials is unnecessary exposure.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onedesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: onedesk
      KC_DB_PASSWORD: onedesk
      KC_HEALTH_ENABLED: "true"
      # Forces a stable issuer (http://localhost:8080/realms/onedesk) regardless of
      # whether the request arrived via the container's internal DNS name or the
      # host's localhost — otherwise tokens minted via one path fail issuer
      # validation when verified via the other (a classic Keycloak dev-mode trap).
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080" # app auth flow (OIDC issuer, redirect URIs) — do not move, matches realm-export.json
      - "9090:8080" # admin console also reachable here, same Keycloak instance
    depends_on:
      postgres:
        condition: service_healthy

  core-api:
    build: ./core-api
    environment:
      PORT: 3000
      DATABASE_URL: postgres://onedesk:onedesk@postgres:5432/core_api
      KEYCLOAK_ISSUER: http://localhost:8080/realms/onedesk
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/onedesk/protocol/openid-connect/certs
      IDENTITY_ADAPTER_URL: http://identity-adapter:4000
      BUSINESS_REGISTRY_ADAPTER_URL: http://business-registry-adapter:4001
      REVENUE_ADAPTER_URL: http://revenue-adapter:4002
      MUNICIPAL_ADAPTER_URL: http://municipal-adapter:4003
      LICENSE_AUTHORITY_ADAPTER_URL: http://license-authority-adapter:4004
      DIGILOCKER_ADAPTER_URL: http://digilocker-adapter:4005
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./core-api:/app
      - core-api-node-modules:/app/node_modules
      - ./db:/app/db
      - core-api-uploads:/app/uploads
    # No host port — the only intended entry point is Kong (localhost:8010). None of
    # the adapters below have their own auth; punching a host port through to any of
    # them would bypass every Keycloak-gated guard core-api enforces.
    depends_on:
      postgres:
        condition: service_healthy

  mdm-service:
    build: ./mdm-service
    environment:
      DATABASE_URL: postgres://onedesk:onedesk@postgres:5432/core_api
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/onedesk/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8080/realms/onedesk
    volumes:
      - ./mdm-service:/app
    depends_on:
      postgres:
        condition: service_healthy

  identity-adapter:
    build: ./connectors/identity-adapter
    environment:
      PORT: 4000

  digilocker-adapter:
    build: ./connectors/digilocker-adapter
    environment:
      PORT: 4005
      DATABASE_URL: postgres://onedesk:onedesk@postgres:5432/digilocker_adapter
      UPLOAD_DIR: /app/uploads
    volumes:
      - digilocker-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  business-registry-adapter:
    build: ./connectors/business-registry-adapter
    environment:
      PORT: 4001

  revenue-adapter:
    build: ./connectors/revenue-adapter
    environment:
      PORT: 4002

  municipal-adapter:
    build: ./connectors/municipal-adapter
    environment:
      PORT: 4003
      DATABASE_URL: postgres://onedesk:onedesk@postgres:5432/municipal_adapter
    depends_on:
      postgres:
        condition: service_healthy

  license-authority-adapter:
    build: ./connectors/license-authority-adapter
    environment:
      PORT: 4004

  kong:
    image: kong:3.8
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      # SSE (GET /applications/events/stream) needs unbuffered proxying or events
      # only flush once nginx's buffer fills / the connection closes.
      KONG_NGINX_PROXY_PROXY_BUFFERING: "off"
    volumes:
      - ./gateway/kong.yml:/kong/declarative/kong.yml
    ports:
      - "8010:8000" # proxy — the single intended entry point for all API traffic
      - "8011:8001" # admin API
    depends_on:
      - core-api
      - mdm-service

volumes:
  postgres-data:
  core-api-node-modules:
  core-api-uploads:
  digilocker-uploads:
